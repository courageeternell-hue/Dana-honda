name: Android APK (GitHub)

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Prepare square app icon
        run: |
          python -m pip install --quiet Pillow
          python scripts/prepare-icon.py
          test -f assets/dana-honda-icon-square.png
          python - <<'PY'
          from PIL import Image
          p = "assets/dana-honda-icon-square.png"
          with Image.open(p) as img:
              assert img.size == (1024, 1024), f"Invalid icon size: {img.size}"
          print("Square icon verified: 1024x1024")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/dana-honda-icon-square.png
          git diff --cached --quiet || git commit -m "chore: prepare square app icon [skip ci]"

      - name: Generate Android project
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: npx expo prebuild --platform android --non-interactive

      - name: Assemble and sign installable APK
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          cd android
          ./gradlew clean assembleRelease --no-daemon --stacktrace
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign -type f | sort -V | tail -1)
          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"
          mkdir -p app/build/outputs/apk/release/final
          "$ZIPALIGN" -f -p 4 "$APK" app/build/outputs/apk/release/final/app-release-aligned.apk
          KEYSTORE="$HOME/.android/debug.keystore"
          if [ ! -f "$KEYSTORE" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkeypair -v -keystore "$KEYSTORE" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          "$APKSIGNER" sign --ks "$KEYSTORE" --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android --out app/build/outputs/apk/release/final/Asisten-Sales.apk app/build/outputs/apk/release/final/app-release-aligned.apk
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/final/Asisten-Sales.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: asisten-sales-android-apk
          path: apps/mobile/android/app/build/outputs/apk/release/final/Asisten-Sales.apk
          if-no-files-found: error
          retention-days: 14
