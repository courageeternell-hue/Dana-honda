name: Expo EAS Android APK

on:
  push:
    branches:
      - native-mobile-app
    paths:
      - "apps/mobile/**"
      - ".github/workflows/expo-eas-build.yml"
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout latest app source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Prepare square app icon
        run: |
          python -m pip install --quiet Pillow
          python scripts/prepare-icon.py

      - name: Verify Expo project configuration
        run: npx expo config --type public

      - name: Build Android APK on Expo EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: npx eas-cli@latest build --platform android --profile preview --non-interactive --wait
