name: Expo EAS Android APK

on:
  push:
    branches:
      - native-mobile-app
    paths:
      - "apps/mobile/**"
      - ".github/workflows/expo-eas-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout latest app source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Prepare square app icon
        run: |
          python -m pip install --quiet Pillow
          python scripts/prepare-icon.py
          test -f assets/dana-honda-icon-square.png
          python - <<'PY'
          from PIL import Image
          p = "assets/dana-honda-icon-square.png"
          with Image.open(p) as img:
              assert img.size == (1024, 1024), f"Invalid icon size: {img.size}"
          print("Square icon verified: 1024x1024")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/dana-honda-icon-square.png
          if ! git diff --cached --quiet; then
            git commit -m "chore: add square Dana Honda launcher icon [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Verify Expo project configuration
        run: npx expo config --type public

      - name: Build Android APK on Expo EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: npx eas-cli@latest build --platform android --profile preview --non-interactive --wait
