name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    name: EAS Android production APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Prepare square app icon
        run: |
          python -m pip install --quiet Pillow
          python scripts/prepare-icon.py
          test -f assets/dana-honda-icon-square.png
          python - <<'PY'
          from PIL import Image
          p = "assets/dana-honda-icon-square.png"
          with Image.open(p) as img:
              assert img.size == (1024, 1024), f"Invalid icon size: {img.size}"
          print("Square icon verified: 1024x1024")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/dana-honda-icon-square.png
          git diff --cached --quiet || git commit -m "chore: prepare square app icon [skip ci]"

      - name: Configure Expo authentication
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::GitHub repository secret EXPO_TOKEN is missing."
            exit 1
          fi
      - name: Build installable Android production APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli build --platform android --profile production-apk --non-interactive --wait
