name: Native mobile checks

on:
  push:
    branches:
      - native-mobile-app
    paths:
      - "apps/mobile/**"
      - ".github/workflows/native-mobile-checks.yml"
  pull_request:
    branches:
      - native-mobile-app
    paths:
      - "apps/mobile/**"
      - ".github/workflows/native-mobile-checks.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies and generate lock file
        run: npm install
      - name: Commit generated package lock
        if: github.event_name == 'push'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(mobile): add npm lockfile"
            git push
          fi
      - name: TypeScript check
        run: npm run typecheck
      - name: Expo dependency check
        run: npx expo-doctor
