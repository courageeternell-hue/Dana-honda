name: Publish OTA Preview

on:
  push:
    branches:
      - native-mobile-app
    paths:
      - "apps/mobile/**"
      - ".github/workflows/ota-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ota-preview
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Android OTA
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install Dependencies
        run: npm install

      - name: Check Expo Configuration
        run: npx expo config --type public

      - name: Publish Android OTA Update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: "1"
        run: >
          npx eas-cli@latest update
          --channel preview
          --environment preview
          --platform android
          --message "Automatic OTA update ${GITHUB_SHA}"
          --non-interactive
